<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Kanakku — Expense Ledger</title>
<link rel="manifest" href="manifest.json?v=2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
<link rel="apple-touch-icon" href="icon-192.png?v=2">
<meta name="theme-color" content="#1B2A4A">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap');

  :root{
    --paper:#FAF6EC;
    --paper-line:#E3D9C2;
    --ink:#1B2A4A;
    --ink-soft:#5B6478;
    --red:#B33A3A;
    --green:#2F6F4E;
    --brass:#C9A227;
    --card:#FFFFFF;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter','Noto Sans Tamil',sans-serif;
    background:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 31px, var(--paper-line) 32px),
      var(--paper);
    color:var(--ink);
    min-height:100vh;
    padding-bottom:70px;
  }
  .brass-rule{
    height:6px;
    background:linear-gradient(90deg, var(--brass), #E8CE6B 40%, var(--brass));
  }
  header{
    background:var(--ink);
    color:var(--paper);
    padding:18px 20px 14px;
    position:sticky; top:0; z-index:10;
  }
  header h1{
    font-family:'Zilla Slab',serif;
    font-size:1.5rem;
    margin:0;
    letter-spacing:0.5px;
  }
  header .sub{
    font-size:0.78rem;
    color:#B9C2D8;
    margin-top:2px;
  }
  #whoami{
    position:absolute; right:20px; top:16px;
    font-size:0.75rem; color:#B9C2D8; text-align:right;
  }
  #whoami button{
    background:none; border:1px solid #B9C2D8; color:#B9C2D8;
    font-size:0.7rem; padding:3px 8px; border-radius:3px; margin-top:4px; cursor:pointer;
  }
  #lang-select{
    background:var(--ink); border:1px solid #B9C2D8; color:var(--paper);
    font-size:0.72rem; padding:3px 6px; border-radius:3px; margin-bottom:5px;
  }

  main{ max-width:640px; margin:0 auto; padding:18px 16px 30px; }

  .screen{ display:none; }
  .screen.active{ display:block; }

  /* --- LOGIN --- */
  #login-screen{
    max-width:400px; margin:60px auto; padding:0 16px;
  }
  .login-card{
    background:var(--card);
    border:1px solid var(--paper-line);
    border-left:6px solid var(--brass);
    border-radius:6px;
    padding:28px 24px;
    box-shadow:0 2px 10px rgba(27,42,74,0.08);
  }
  .login-card h2{
    font-family:'Zilla Slab',serif;
    margin:0 0 4px;
  }
  .login-card p.hint{ color:var(--ink-soft); font-size:0.85rem; margin-top:0; margin-bottom:20px;}
  label{ font-size:0.8rem; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:6px; }
  select, input, button, textarea{
    font-family:inherit; font-size:1rem;
  }
  select#person-select, input#pin-input{
    width:100%; padding:11px 12px; border:1px solid var(--paper-line);
    border-radius:5px; margin-bottom:16px; background:var(--paper);
    color:var(--ink);
  }
  .btn-primary{
    width:100%; padding:13px; background:var(--ink); color:var(--paper);
    border:none; border-radius:5px; font-weight:600; cursor:pointer; font-size:1rem;
    letter-spacing:0.3px;
  }
  .btn-primary:active{ opacity:0.85; }
  .btn-primary:disabled{ opacity:0.6; cursor:default; }
  #login-error{ color:var(--red); font-size:0.85rem; margin-top:10px; display:none; }

  /* --- TABS --- */
  .tabbar{
    position:fixed; bottom:0; left:0; right:0;
    background:var(--card);
    border-top:1px solid var(--paper-line);
    display:flex; z-index:10;
  }
  .tabbar button{
    flex:1; padding:12px 4px 10px; background:none; border:none;
    font-family:'Inter',sans-serif; font-size:0.72rem; color:var(--ink-soft);
    cursor:pointer; font-weight:600;
  }
  .tabbar button .ic{ display:block; font-size:1.15rem; margin-bottom:2px; }
  .tabbar button.active{ color:var(--ink); }
  .tabbar button.active .ic{ color:var(--brass); }

  /* --- CARD --- */
  .card{
    background:var(--card); border:1px solid var(--paper-line); border-radius:6px;
    padding:18px; margin-bottom:16px; box-shadow:0 1px 4px rgba(27,42,74,0.05);
  }
  .card h3{ font-family:'Zilla Slab',serif; margin:0 0 14px; font-size:1.15rem; }

  input[type=date], input[type=number], input[type=text], select.field{
    width:100%; padding:11px 12px; border:1px solid var(--paper-line);
    border-radius:5px; margin-bottom:14px; background:var(--paper); color:var(--ink);
  }
  .amount-field{ font-family:'IBM Plex Mono',monospace; font-weight:600; }
  .row2{ display:flex; gap:10px; }
  .row2 > div{ flex:1; }

  /* --- ENTRIES LIST --- */
  .entry{
    display:flex; justify-content:space-between; align-items:center;
    padding:12px 0; border-bottom:1px dashed var(--paper-line);
  }
  .entry:last-child{ border-bottom:none; }
  .entry .meta{ font-size:0.78rem; color:var(--ink-soft); }
  .entry .cat{ font-weight:600; font-size:0.92rem; }
  .entry .amt{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--red); font-size:1rem; }
  .entry .del{ background:none; border:none; color:var(--ink-soft); font-size:0.7rem; cursor:pointer; margin-left:10px; text-decoration:underline; }
  .empty-note{ color:var(--ink-soft); font-size:0.88rem; text-align:center; padding:20px 0; }

  /* --- REPORTS --- */
  .period-toggle{ display:flex; gap:6px; margin-bottom:14px; flex-wrap:wrap; }
  .period-toggle button{
    flex:1; min-width:70px; padding:9px 4px; border:1px solid var(--paper-line);
    background:var(--paper); border-radius:5px; font-size:0.78rem; font-weight:600;
    color:var(--ink-soft); cursor:pointer;
  }
  .period-toggle button.active{ background:var(--ink); color:var(--paper); border-color:var(--ink); }

  .total-banner{
    background:var(--ink); color:var(--paper); border-radius:6px; padding:18px;
    text-align:center; margin-bottom:16px;
  }
  .total-banner .label{ font-size:0.75rem; color:#B9C2D8; text-transform:uppercase; letter-spacing:1px; }
  .total-banner .value{ font-family:'IBM Plex Mono',monospace; font-size:1.9rem; font-weight:600; margin-top:4px; }

  table.breakdown{ width:100%; border-collapse:collapse; font-size:0.88rem; }
  table.breakdown th{ text-align:left; color:var(--ink-soft); font-weight:600; font-size:0.72rem;
    text-transform:uppercase; letter-spacing:0.5px; padding-bottom:8px; border-bottom:1px solid var(--paper-line); }
  table.breakdown td{ padding:8px 0; border-bottom:1px dashed var(--paper-line); }
  table.breakdown td.num{ font-family:'IBM Plex Mono',monospace; text-align:right; }

  .export-btn{
    width:100%; padding:11px; background:var(--paper); border:1px solid var(--ink);
    color:var(--ink); border-radius:5px; font-weight:600; cursor:pointer; margin-top:6px;
  }

  h4.section-label{ font-family:'Zilla Slab',serif; font-size:0.98rem; margin:18px 0 8px; }
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <h2>Kanakku</h2>
    <p class="hint" data-i18n="loginHint">The shared expense ledger. Pick your name to continue.</p>
    <label for="person-select" data-i18n="yourName">Your name</label>
    <select id="person-select"></select>
    <label for="pin-input" data-i18n="yourPin">Your PIN</label>
    <input id="pin-input" type="password" inputmode="numeric" data-i18n-placeholder="enterPin" placeholder="Enter your PIN">
    <button class="btn-primary" onclick="doLogin()" data-i18n="openLedger">Open Ledger</button>
    <div id="login-error" data-i18n="wrongPin">Incorrect PIN for this name. Try again.</div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-screen" style="display:none;">
  <header>
    <h1>Kanakku</h1>
    <div class="sub" data-i18n="tagline">Shared expense ledger</div>
    <div id="whoami">
      <select id="lang-select" onchange="setLanguage(this.value)">
        <option value="en">English</option>
        <option value="ta">தமிழ்</option>
      </select>
      <div id="whoami-name"></div>
      <button onclick="doLogout()" data-i18n="switchUser">Switch user</button>
    </div>
  </header>
  <div class="brass-rule"></div>

  <main>
    <!-- ADD EXPENSE -->
    <div class="screen active" id="screen-add">
      <div class="card">
        <h3 data-i18n="newEntry">New Entry</h3>
        <label data-i18n="date">Date</label>
        <input type="date" id="f-date">
        <label data-i18n="category">Category</label>
        <select class="field" id="f-category"></select>
        <div id="new-category-wrap" style="display:none; background:var(--paper); border:1px dashed var(--brass); border-radius:5px; padding:12px; margin:-6px 0 14px;">
          <label data-i18n="newCategoryEn" style="margin-bottom:4px;">Category name (English)</label>
          <input type="text" id="new-cat-en" style="margin-bottom:10px;">
          <label data-i18n="newCategoryTa" style="margin-bottom:4px;">Category name (Tamil) — optional</label>
          <input type="text" id="new-cat-ta" style="margin-bottom:10px;">
          <div style="display:flex; gap:8px;">
            <button type="button" onclick="addNewCategory()" data-i18n="addCategoryBtn" style="flex:1; padding:9px; background:var(--ink); color:var(--paper); border:none; border-radius:5px; font-weight:600; cursor:pointer;">Add category</button>
            <button type="button" onclick="cancelNewCategory()" data-i18n="cancel" style="flex:1; padding:9px; background:var(--card); color:var(--ink-soft); border:1px solid var(--paper-line); border-radius:5px; font-weight:600; cursor:pointer;">Cancel</button>
          </div>
        </div>
        <label data-i18n="amount">Amount (₹)</label>
        <input type="number" class="amount-field" id="f-amount" placeholder="0.00" min="0" step="0.01">
        <label data-i18n="note">Note (optional)</label>
        <input type="text" id="f-note" data-i18n-placeholder="notePlaceholder" placeholder="e.g. cement bags, auto fare">
        <div id="receipt-wrap" style="display:none;">
          <label><span data-i18n="receiptLabel">Receipt / bill photo</span> <span id="receipt-required" style="color:var(--red);"></span></label>
          <input type="file" id="f-receipt" accept="image/*,.pdf" capture="environment">
          <div id="receipt-preview" style="font-size:0.78rem; color:var(--ink-soft); margin:-8px 0 14px;"></div>
        </div>
        <div id="upload-progress" style="display:none; font-size:0.8rem; color:var(--ink-soft); margin-bottom:10px;"></div>
        <button class="btn-primary" id="save-btn" onclick="submitExpense()" data-i18n="saveEntry">Save Entry</button>
      </div>
    </div>

    <!-- ENTRIES -->
    <div class="screen" id="screen-entries">
      <div class="card">
        <h3 data-i18n="recentEntries">Recent Entries</h3>
        <div id="entries-list"><div class="empty-note" data-i18n="loading">Loading…</div></div>
      </div>
    </div>

    <!-- REPORTS -->
    <div class="screen" id="screen-reports">
      <div class="card">
        <h3 data-i18n="reports">Reports</h3>
        <div class="period-toggle" id="period-toggle">
          <button data-period="daily" class="active" data-i18n="periodDaily">Daily</button>
          <button data-period="fortnightly" data-i18n="periodFortnight">Fortnight</button>
          <button data-period="monthly" data-i18n="periodMonthly">Monthly</button>
          <button data-period="yearly" data-i18n="periodYearly">Yearly</button>
        </div>
        <label data-i18n="anchorDate">Anchor date</label>
        <input type="date" id="report-date">
        <div class="total-banner">
          <div class="label" id="report-range-label" data-i18n="today">Today</div>
          <div class="value" id="report-total">₹0</div>
        </div>
        <h4 class="section-label" data-i18n="byCategory">By category</h4>
        <table class="breakdown" id="cat-breakdown"><thead><tr><th data-i18n="colCategory">Category</th><th class="num" data-i18n="colAmount">Amount</th></tr></thead><tbody></tbody></table>
        <h4 class="section-label" data-i18n="byPerson">By person</h4>
        <table class="breakdown" id="person-breakdown"><thead><tr><th data-i18n="colPerson">Person</th><th class="num" data-i18n="colAmount">Amount</th></tr></thead><tbody></tbody></table>
        <button class="export-btn" onclick="exportCSV()" data-i18n="exportCsv">Export this period as CSV</button>
      </div>
    </div>
  </main>

  <div class="tabbar">
    <button class="tab-btn active" data-screen="screen-add" onclick="switchTab('screen-add', this)">
      <span class="ic">＋</span><span data-i18n="tabAdd">Add</span>
    </button>
    <button class="tab-btn" data-screen="screen-entries" onclick="switchTab('screen-entries', this)">
      <span class="ic">☰</span><span data-i18n="tabEntries">Entries</span>
    </button>
    <button class="tab-btn" data-screen="screen-reports" onclick="switchTab('screen-reports', this)">
      <span class="ic">▤</span><span data-i18n="tabReports">Reports</span>
    </button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>

    confirmLogout: "வெளியேறவா? மீண்டும் நுழைய உங்கள் பின் தேவைப்படும்.",
    selected: (name) => `தேர்ந்தெடுக்கப்பட்டது: ${name}`,
    tabAdd: "சேர்", tabEntries: "பதிவுகள்", tabReports: "அறிக்கைகள்",
    today: "இன்று"
  }
};
let currentLang = localStorage.getItem("kanakku_lang") || "en";
function t(key, ...args){
  const dict = TRANSLATIONS[currentLang] || TRANSLATIONS.en;
  const val = (key in dict) ? dict[key] : TRANSLATIONS.en[key];
  return typeof val === "function" ? val(...args) : val;
}
function applyLanguage(){
  document.documentElement.lang = currentLang;
  document.getElementById("lang-select").value = currentLang;
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
  document.getElementById("receipt-required").textContent = t("receiptRequired", RECEIPT_THRESHOLD);
  if(currentPerson){
    document.getElementById("whoami-name").textContent = currentPerson + (isAdmin() ? ` · ${t("adminBadge")}` : "");
  }
  renderCategoryDropdown();
  renderEntries();
  if(document.getElementById("screen-reports").classList.contains("active")) renderReport();
}
function setLanguage(lang){
  currentLang = lang;
  localStorage.setItem("kanakku_lang", lang);
  applyLanguage();
}

// ---------- LOGIN ----------
function populateLogin(){
  const sel = document.getElementById("person-select");
  sel.innerHTML = Object.keys(PEOPLE_PINS).map(p => `<option value="${p}">${p}</option>`).join("");
}
function doLogin(){
  const person = document.getElementById("person-select").value;
  const pin = document.getElementById("pin-input").value;
  if(pin !== PEOPLE_PINS[person]){
    document.getElementById("login-error").style.display = "block";
    return;
  }
  document.getElementById("login-error").style.display = "none";
  currentPerson = person;
  localStorage.setItem("kanakku_person", person);
  enterApp();
}
async function doLogout(){
  if(!confirm(t("confirmLogout"))) return;

  localStorage.removeItem("kanakku_person");
  currentPerson = null;

  // Clear any cached app shell so the next login always starts fresh —
  // on the Add screen, not whatever tab/report was open before logging out.
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
  } catch(e){ /* non-fatal — proceed to reload regardless */ }

  location.reload();
}
function enterApp(){
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
  document.getElementById("whoami-name").textContent = currentPerson + (isAdmin() ? ` · ${t("adminBadge")}` : "");
  applyLanguage();
}

// ---------- TABS ----------
function switchTab(screenId, btn){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("active"));
  document.getElementById(screenId).classList.add("active");
  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  if(screenId === "screen-reports") renderReport();
}

// ---------- ADD EXPENSE ----------
function populateForm(){
  document.getElementById("f-date").value = todayISO();
  renderCategoryDropdown();
}
function mergedCategories(){
  // Static defaults from firebase-config.js, plus anything added live by any
  // user (from Firestore). If a name collides, the live-added one wins so
  // edits made from the app itself always take precedence.
  const map = new Map();
  CATEGORIES.forEach(c => map.set(c.en.toLowerCase(), c));
  dynamicCategories.forEach(c => map.set(c.en.toLowerCase(), c));
  return Array.from(map.values());
}
function categoryLabel(enKey){
  const found = mergedCategories().find(c => c.en.toLowerCase() === String(enKey).toLowerCase());
  if(!found) return enKey; // older entry, or category since removed — show raw value
  return currentLang === "ta" ? (found.ta || found.en) : found.en;
}
function renderCategoryDropdown(preserveValue){
  const sel = document.getElementById("f-category");
  const prev = preserveValue !== undefined ? preserveValue : sel.value;
  const options = mergedCategories().map(c =>
    `<option value="${escapeHtml(c.en)}">${escapeHtml(currentLang === "ta" ? (c.ta || c.en) : c.en)}</option>`
  ).join("");
  sel.innerHTML = options + `<option value="__new__">${escapeHtml(t("addNewCategory"))}</option>`;
  if(prev && mergedCategories().some(c => c.en === prev)){
    sel.value = prev;
  }
}
document.getElementById("f-category").addEventListener("change", (e) => {
  if(e.target.value === "__new__"){
    document.getElementById("new-category-wrap").style.display = "block";
    document.getElementById("new-cat-en").value = "";
    document.getElementById("new-cat-ta").value = "";
    document.getElementById("new-cat-en").focus();
  } else {
    document.getElementById("new-category-wrap").style.display = "none";
  }
});
function cancelNewCategory(){
  document.getElementById("new-category-wrap").style.display = "none";
  const merged = mergedCategories();
  if(merged.length) document.getElementById("f-category").value = merged[0].en;
}
function addNewCategory(){
  const en = document.getElementById("new-cat-en").value.trim();
  const ta = document.getElementById("new-cat-ta").value.trim();
  if(!en){ alert(t("categoryNameRequired")); return; }

  const existing = mergedCategories().find(c => c.en.toLowerCase() === en.toLowerCase());
  if(existing){
    alert(t("categoryExists"));
    document.getElementById("new-category-wrap").style.display = "none";
    renderCategoryDropdown(existing.en);
    return;
  }

  pendingCategorySelect = en;
  categoriesRef.add({ en, ta: ta || en }).catch(err => {
    alert(t("couldNotSave") + err.message);
  });
  document.getElementById("new-category-wrap").style.display = "none";
}
function startCategorySync(){
  categoriesRef.onSnapshot(snap => {
    dynamicCategories = [];
    snap.forEach(doc => dynamicCategories.push(doc.data()));
    const selectNow = pendingCategorySelect;
    pendingCategorySelect = null;
    renderCategoryDropdown(selectNow || undefined);
  }, () => { /* if categories collection/rules aren't set up yet, defaults still work */ });
}
function todayISO(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function toggleReceiptField(){
  if(!RECEIPT_ENABLED){
    document.getElementById("receipt-wrap").style.display = "none";
    return;
  }
  const amount = parseFloat(document.getElementById("f-amount").value) || 0;
  const wrap = document.getElementById("receipt-wrap");
  wrap.style.display = amount > 0 ? "block" : "none";
  document.getElementById("receipt-required").style.display = amount > RECEIPT_THRESHOLD ? "inline" : "none";
}
document.getElementById("f-amount").addEventListener("input", toggleReceiptField);
document.getElementById("f-receipt").addEventListener("change", (e) => {
  const f = e.target.files[0];
  document.getElementById("receipt-preview").textContent = f ? t("selected", f.name) : "";
});

// Resize + compress images client-side before upload (skips PDFs).
// Cuts a typical 4-8MB phone photo down to a few hundred KB, which is what
// makes uploads fast even on slow/rural mobile data.
function compressImage(file, maxDim = 1280, quality = 0.72){
  return new Promise((resolve, reject) => {
    if(!file.type.startsWith("image/")){ resolve(file); return; }
    const reader = new FileReader();
    reader.onerror = () => resolve(file); // fall back to original on any issue
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = () => resolve(file);
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          if(width > height){ height = Math.round(height * maxDim / width); width = maxDim; }
          else { width = Math.round(width * maxDim / height); height = maxDim; }
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        canvas.toBlob((blob) => {
          if(!blob){ resolve(file); return; }
          resolve(new File([blob], file.name.replace(/\.\w+$/, ".jpg"), { type: "image/jpeg" }));
        }, "image/jpeg", quality);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

async function submitExpense(){
  const date = document.getElementById("f-date").value;
  const category = document.getElementById("f-category").value;
  const amount = parseFloat(document.getElementById("f-amount").value);
  const note = document.getElementById("f-note").value.trim();
  const fileInput = document.getElementById("f-receipt");
  const rawFile = RECEIPT_ENABLED ? fileInput.files[0] : null;

  if(!date || !amount || amount <= 0){
    alert(t("validDateAmount"));
    return;
  }
  if(category === "__new__"){
    alert(t("categoryNameRequired"));
    document.getElementById("new-cat-en").focus();
    return;
  }
  if(RECEIPT_ENABLED && amount > RECEIPT_THRESHOLD && !rawFile){
    alert(t("receiptRequiredAlert", RECEIPT_THRESHOLD));
    return;
  }

  const saveBtn = document.getElementById("save-btn");
  const progressEl = document.getElementById("upload-progress");
  saveBtn.disabled = true;

  function resetForm(){
    document.getElementById("f-amount").value = "";
    document.getElementById("f-note").value = "";
    document.getElementById("f-date").value = todayISO();
    fileInput.value = "";
    document.getElementById("receipt-preview").textContent = "";
    document.getElementById("receipt-wrap").style.display = "none";
    progressEl.style.display = "none";
    saveBtn.disabled = false;
  }

  function saveDoc(receiptUrl){
    expensesRef.add({
      date, category, amount, note,
      person: currentPerson,
      receiptUrl: receiptUrl || null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    }).then(resetForm).catch(err => {
      alert(t("couldNotSave") + err.message);
      progressEl.style.display = "none";
      saveBtn.disabled = false;
    });
  }

  if(!rawFile){ saveDoc(null); return; }

  try{
    progressEl.style.display = "block";
    progressEl.textContent = t("compressingImage");
    const file = await compressImage(rawFile);

    if(file.size > MAX_UPLOAD_BYTES){
      alert(t("fileTooLarge"));
      progressEl.style.display = "none";
      saveBtn.disabled = false;
      return;
    }

    const path = `receipts/${Date.now()}_${currentPerson}_${file.name}`;
    const uploadTask = storage.ref().child(path).put(file);
    uploadTask.on("state_changed", (snap) => {
      const pct = Math.round(100 * snap.bytesTransferred / snap.totalBytes);
      progressEl.textContent = t("uploadingReceipt", pct);
    }, (err) => {
      alert(t("uploadFailed") + err.message);
      progressEl.style.display = "none";
      saveBtn.disabled = false;
    }, () => {
      uploadTask.snapshot.ref.getDownloadURL().then(saveDoc);
    });
  } catch(err){
    alert(t("uploadFailed") + err.message);
    progressEl.style.display = "none";
    saveBtn.disabled = false;
  }
}

// ---------- LIVE SYNC ----------
function startSync(){
  expensesRef.orderBy("date", "desc").onSnapshot(snap => {
    allExpenses = [];
    snap.forEach(doc => allExpenses.push({ id: doc.id, ...doc.data() }));
    renderEntries();
    if(document.getElementById("screen-reports").classList.contains("active")) renderReport();
  }, err => {
    document.getElementById("entries-list").innerHTML =
      `<div class="empty-note">${t("syncError")}${err.message}</div>`;
  });
}

function isAdmin(){
  return (typeof ADMIN_USERS !== "undefined") && ADMIN_USERS.includes(currentPerson);
}
function renderEntries(){
  const list = document.getElementById("entries-list");
  if(allExpenses.length === 0){
    list.innerHTML = `<div class="empty-note">${t("noEntries")}</div>`;
    return;
  }
  list.innerHTML = allExpenses.slice(0, 60).map(e => {
    const canDelete = isAdmin() || e.person === currentPerson;
    return `
    <div class="entry">
      <div>
        <div class="cat">${escapeHtml(categoryLabel(e.category))}</div>
        <div class="meta">${e.date} · ${escapeHtml(e.person)}${e.note ? " · " + escapeHtml(e.note) : ""}</div>
        ${e.receiptUrl ? `<a href="${e.receiptUrl}" target="_blank" rel="noopener" style="font-size:0.75rem; color:var(--green); text-decoration:underline;">${t("viewReceipt")}</a>` : ""}
      </div>
      <div style="text-align:right;">
        <div class="amt">₹${Number(e.amount).toFixed(2)}</div>
        ${canDelete ? `<button class="del" onclick="deleteEntry('${e.id}')">${t("delete")}</button>` : ""}
      </div>
    </div>
  `;
  }).join("");
}
function deleteEntry(id){
  if(confirm(t("confirmDelete"))) expensesRef.doc(id).delete();
}
function escapeHtml(s){
  return (s || "").replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

// ---------- REPORTS ----------
document.addEventListener("DOMContentLoaded", () => {
  document.getElementById("report-date").value = todayISO();
  document.querySelectorAll("#period-toggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll("#period-toggle button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentPeriod = btn.dataset.period;
      renderReport();
    });
  });
  document.getElementById("report-date").addEventListener("change", renderReport);
});

function getRange(period, anchorISO){
  const anchor = new Date(anchorISO + "T00:00:00");
  const locale = currentLang === "ta" ? "ta-IN" : "en-IN";
  let start, end, label;
  if(period === "daily"){
    start = new Date(anchor); end = new Date(anchor);
    label = anchor.toLocaleDateString(locale, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
  } else if(period === "fortnightly"){
    const day = anchor.getDate();
    if(day <= 15){
      start = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
      end = new Date(anchor.getFullYear(), anchor.getMonth(), 15);
    } else {
      start = new Date(anchor.getFullYear(), anchor.getMonth(), 16);
      end = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
    }
    const opts = { day: "numeric", month: "short" };
    label = `${start.toLocaleDateString(locale, opts)} – ${end.toLocaleDateString(locale, opts)}`;
  } else if(period === "monthly"){
    start = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
    end = new Date(anchor.getFullYear(), anchor.getMonth() + 1, 0);
    label = start.toLocaleDateString(locale, { month: "long", year: "numeric" });
  } else if(period === "yearly"){
    start = new Date(anchor.getFullYear(), 0, 1);
    end = new Date(anchor.getFullYear(), 11, 31);
    label = String(anchor.getFullYear());
  }
  return { start, end, label };
}

function renderReport(){
  const anchorISO = document.getElementById("report-date").value || todayISO();
  const { start, end, label } = getRange(currentPeriod, anchorISO);
  const startStr = isoOf(start), endStr = isoOf(end);

  const filtered = allExpenses.filter(e => e.date >= startStr && e.date <= endStr);
  const total = filtered.reduce((s,e) => s + Number(e.amount), 0);

  document.getElementById("report-range-label").textContent = label;
  document.getElementById("report-total").textContent = "₹" + total.toFixed(2);

  renderBreakdown("cat-breakdown", filtered, "category");
  renderBreakdown("person-breakdown", filtered, "person");

  window._lastReportRows = filtered; // for CSV export
  window._lastReportLabel = label;
}
function isoOf(d){ return d.toISOString().slice(0,10); }

function renderBreakdown(tableId, rows, key){
  const totals = {};
  rows.forEach(e => { totals[e[key]] = (totals[e[key]] || 0) + Number(e.amount); });
  const tbody = document.querySelector(`#${tableId} tbody`);
  const entries = Object.entries(totals).sort((a,b) => b[1]-a[1]);
  if(entries.length === 0){
    tbody.innerHTML = `<tr><td colspan="2" style="color:#5B6478;">${t("noEntriesPeriod")}</td></tr>`;
    return;
  }
  const label = key === "category" ? categoryLabel : (k => k);
  tbody.innerHTML = entries.map(([k,v]) =>
    `<tr><td>${escapeHtml(label(k))}</td><td class="num">₹${v.toFixed(2)}</td></tr>`
  ).join("");
}

function exportCSV(){
  const rows = window._lastReportRows || [];
  if(rows.length === 0){ alert(t("noExport")); return; }
  let csv = "Date,Person,Category,Amount,Note\n";
  rows.forEach(e => {
    csv += `${e.date},"${(e.person||"").replace(/"/g,'""')}","${(e.category||"").replace(/"/g,'""')}",${e.amount},"${(e.note||"").replace(/"/g,'""')}"\n`;
  });
  const blob = new Blob([csv], { type: "text/csv" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `kanakku-${(window._lastReportLabel||"report").replace(/\s+/g,'-')}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

populateLogin();
populateForm();
toggleReceiptField();
if(currentPerson){
  enterApp();
} else {
  document.getElementById("lang-select").value = currentLang; // harmless if hidden

startSync();
startCategorySync();

if('serviceWorker' in navigator){

  });
}
